<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#050814"/></linearGradient><radialGradient id="glowPurple" cx="20%" cy="25%" r="45%"><stop offset="0%" stop-color="#8b5cf6" stop-opacity=".35"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient><radialGradient id="glowCyan" cx="80%" cy="75%" r="45%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".3"/><stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/></radialGradient><radialGradient id="glowBlue" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#3b82f6" stop-opacity=".25"/><stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/></radialGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#67e8f9"/><stop offset="35%" stop-color="#38bdf8"/><stop offset="70%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="pillGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".8"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".9"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#334155" stroke-opacity=".3" stroke-width=".75" d="M 40 0 L 0 0 0 40"/></pattern><filter id="glowEffect" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="pulseGlow" width="160%" height="160%" x="-30%" y="-30%"><feGaussianBlur result="blur" stdDeviation="4"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>@keyframes pulseNode{0%{opacity:.35;transform:scale(.95)}}@keyframes floatOrb{0%{transform:translateY(0) translateX(0)}}.banner-title{font-weight:800;font-size:52px;letter-spacing:-1px}.banner-subtitle,.banner-title,.pill-text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif}.banner-subtitle{font-weight:400;font-size:19px;fill:#94a3b8;letter-spacing:.2px}.pill-text{font-size:13px;font-weight:600;letter-spacing:.3px}.traffic-flow{stroke-dasharray:8 16;animation:flowAnimation 20s linear infinite}.pulse-node{animation:pulseNode 3s ease-in-out infinite alternate}.pulse-node-2{animation:pulseNode 4s ease-in-out infinite alternate 1.5s}.wave-orb{animation:floatOrb 8s ease-in-out infinite alternate}</style></defs><rect width="100%" height="100%" fill="url(#bgGrad)"/><g class="wave-orb"><circle cx="180" cy="110" r="260" fill="url(#glowPurple)"/><circle cx="1020" cy="310" r="280" fill="url(#glowCyan)"/><circle cx="600" cy="200" r="240" fill="url(#glowBlue)"/></g><rect width="100%" height="100%" fill="url(#grid)"/><g opacity=".45"><path fill="none" stroke="#38bdf8" stroke-width="2" d="M 0,90 Q 300,40 600,90 T 1200,70" class="traffic-flow"/><path fill="none" stroke="#818cf8" stroke-width="2.5" d="M 0,130 C 400,180 800,40 1200,120" class="traffic-flow"/><path fill="none" stroke="#06b6d4" stroke-width="2" d="M 0,330 Q 400,380 750,330 T 1200,350" class="traffic-flow"/><path fill="none" stroke="#c084fc" stroke-width="1.8" d="M 0,370 C 350,320 850,410 1200,360" class="traffic-flow"/></g><g opacity=".6"><circle cx="100" cy="90" r="5" fill="#38bdf8" class="pulse-node"/><circle cx="1100" cy="120" r="6" fill="#818cf8" class="pulse-node-2"/><circle cx="150" cy="330" r="5.5" fill="#06b6d4" class="pulse-node-2"/><circle cx="1060" cy="350" r="6.5" fill="#c084fc" class="pulse-node"/></g><g><g transform="translate(600, 0) translate(0, 72)"><rect width="330" height="36" x="-165" y="-18" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" opacity=".9" rx="18"/><circle cx="-135" cy="0" r="4.5" fill="#38bdf8" filter="url(#pulseGlow)"/><text x="5" y="5" fill="#c7d2fe" class="pill-text" text-anchor="middle">🚀 CLOUD-NATIVE &amp; ENTERPRISE APIM</text></g><text x="0" y="165" fill="url(#titleGrad)" class="banner-title" filter="url(#glowEffect)" text-anchor="middle" transform="translate(600, 0)">Enterprise API Gateway</text><text x="0" y="215" class="banner-subtitle" text-anchor="middle" transform="translate(600, 0)">Curated Landscape of Production-Ready SaaS Platforms &amp; Open-Source Traffic Proxies</text><g><g transform="translate(600, 0) translate(0, 290) translate(-390, 0)"><rect width="170" height="36" x="-85" y="-18" fill="url(#pillGrad)" stroke="#38bdf8" stroke-width="1" rx="18"/><text x="0" y="5" fill="#7dd3fc" class="pill-text" text-anchor="middle">⚡ Traffic Routing</text></g><g transform="translate(600, 0) translate(0, 290) translate(-195, 0)"><rect width="170" height="36" x="-85" y="-18" fill="url(#pillGrad)" stroke="#818cf8" stroke-width="1" rx="18"/><text x="0" y="5" fill="#c7d2fe" class="pill-text" text-anchor="middle">🛡️ OAuth2 &amp; mTLS</text></g><g transform="translate(600, 0) translate(0, 290) translate(0, 0)"><rect width="170" height="36" x="-85" y="-18" fill="url(#pillGrad)" stroke="#ec4899" stroke-width="1" rx="18"/><text x="0" y="5" fill="#f472b6" class="pill-text" text-anchor="middle">🤖 AI Gateway &amp; MCP</text></g><g transform="translate(600, 0) translate(0, 290) translate(195, 0)"><rect width="170" height="36" x="-85" y="-18" fill="url(#pillGrad)" stroke="#34d399" stroke-width="1" rx="18"/><text x="0" y="5" fill="#6ee7b7" class="pill-text" text-anchor="middle">☸️ K8s Ingress / API</text></g><g transform="translate(600, 0) translate(0, 290) translate(390, 0)"><rect width="170" height="36" x="-85" y="-18" fill="url(#pillGrad)" stroke="#fbbf24" stroke-width="1" rx="18"/><text x="0" y="5" fill="#fde68a" class="pill-text" text-anchor="middle">📊 Observability</text></g></g><text x="0" y="375" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" letter-spacing="1.5" text-anchor="middle" transform="translate(600, 0)">HIGH THROUGHPUT • MULTI-CLOUD • RESILIENT INFRASTRUCTURE</text></g></svg>