<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <!-- Mesh Glow Gradients -->
    <radialGradient id="glowPurple" cx="20%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowCyan" cx="80%" cy="75%" r="45%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Pill Gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="pulseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .banner-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 52px;
        letter-spacing: -1px;
      }
      .banner-subtitle {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 19px;
        fill: #94a3b8;
        letter-spacing: 0.2px;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.3px;
      }
      .traffic-flow {
        stroke-dasharray: 8 16;
        animation: flowAnimation 20s linear infinite;
      }
      .pulse-node {
        animation: pulseNode 3s ease-in-out infinite alternate;
      }
      .pulse-node-2 {
        animation: pulseNode 4s ease-in-out infinite alternate 1.5s;
      }
      .wave-orb {
        animation: floatOrb 8s ease-in-out infinite alternate;
      }
      @keyframes flowAnimation {
        from { stroke-dashoffset: 400; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes pulseNode {
        0% { opacity: 0.35; transform: scale(0.95); }
        100% { opacity: 0.9; transform: scale(1.08); }
      }
      @keyframes floatOrb {
        0% { transform: translateY(0px) translateX(0px); }
        100% { transform: translateY(-15px) translateX(10px); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Ambient Floating Orbs in Background -->
  <g class="wave-orb">
    <circle cx="180" cy="110" r="260" fill="url(#glowPurple)" />
    <circle cx="1020" cy="310" r="280" fill="url(#glowCyan)" />
    <circle cx="600" cy="200" r="240" fill="url(#glowBlue)" />
  </g>

  <!-- Background Mesh Grid -->
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Dynamic Network Traffic Lines (Background Elements) -->
  <g opacity="0.45">
    <!-- Top Route -->
    <path class="traffic-flow" d="M 0,90 Q 300,40 600,90 T 1200,70" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="traffic-flow" d="M 0,130 C 400,180 800,40 1200,120" fill="none" stroke="#818cf8" stroke-width="2.5" />
    <!-- Bottom Route -->
    <path class="traffic-flow" d="M 0,330 Q 400,380 750,330 T 1200,350" fill="none" stroke="#06b6d4" stroke-width="2" />
    <path class="traffic-flow" d="M 0,370 C 350,320 850,410 1200,360" fill="none" stroke="#c084fc" stroke-width="1.8" />
  </g>

  <!-- Interactive/Dynamic Circuit Nodes in Far Edges -->
  <g opacity="0.6">
    <circle cx="100" cy="90" r="5" fill="#38bdf8" class="pulse-node" />
    <circle cx="1100" cy="120" r="6" fill="#818cf8" class="pulse-node-2" />
    <circle cx="150" cy="330" r="5.5" fill="#06b6d4" class="pulse-node-2" />
    <circle cx="1060" cy="350" r="6.5" fill="#c084fc" class="pulse-node" />
  </g>

  <!-- Foreground Content Area: Perfectly Centered & High Contrast -->
  <g transform="translate(600, 0)">
    <!-- Top Tag / Pill -->
    <g transform="translate(0, 72)">
      <rect x="-165" y="-18" width="330" height="36" rx="18" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" opacity="0.9" />
      <circle cx="-135" cy="0" r="4.5" fill="#38bdf8" filter="url(#pulseGlow)" />
      <text x="5" y="5" text-anchor="middle" fill="#c7d2fe" class="pill-text">🚀 CLOUD-NATIVE &amp; ENTERPRISE APIM</text>
    </g>

    <!-- Main Title in Forefront -->
    <text x="0" y="165" text-anchor="middle" fill="url(#titleGrad)" class="banner-title" filter="url(#glowEffect)">
      Enterprise API Gateway
    </text>

    <!-- Subtitle -->
    <text x="0" y="215" text-anchor="middle" class="banner-subtitle">
      Curated Landscape of Production-Ready SaaS Platforms &amp; Open-Source Traffic Proxies
    </text>

    <!-- Feature Feature / Architecture Capability Badges (Bottom Row) -->
    <g transform="translate(0, 290)">
      <!-- Pill 1: Traffic Routing & Policy -->
      <g transform="translate(-390, 0)">
        <rect x="-85" y="-18" width="170" height="36" rx="18" fill="url(#pillGrad)" stroke="#38bdf8" stroke-width="1" />
        <text x="0" y="5" text-anchor="middle" fill="#7dd3fc" class="pill-text">⚡ Traffic Routing</text>
      </g>

      <!-- Pill 2: Rate Limiting & Auth -->
      <g transform="translate(-195, 0)">
        <rect x="-85" y="-18" width="170" height="36" rx="18" fill="url(#pillGrad)" stroke="#818cf8" stroke-width="1" />
        <text x="0" y="5" text-anchor="middle" fill="#c7d2fe" class="pill-text">🛡️ OAuth2 &amp; mTLS</text>
      </g>

      <!-- Pill 3: AI Gateway / MCP -->
      <g transform="translate(0, 0)">
        <rect x="-85" y="-18" width="170" height="36" rx="18" fill="url(#pillGrad)" stroke="#ec4899" stroke-width="1" />
        <text x="0" y="5" text-anchor="middle" fill="#f472b6" class="pill-text">🤖 AI Gateway &amp; MCP</text>
      </g>

      <!-- Pill 4: Microservices / K8s -->
      <g transform="translate(195, 0)">
        <rect x="-85" y="-18" width="170" height="36" rx="18" fill="url(#pillGrad)" stroke="#34d399" stroke-width="1" />
        <text x="0" y="5" text-anchor="middle" fill="#6ee7b7" class="pill-text">☸️ K8s Ingress / API</text>
      </g>

      <!-- Pill 5: Observability -->
      <g transform="translate(390, 0)">
        <rect x="-85" y="-18" width="170" height="36" rx="18" fill="url(#pillGrad)" stroke="#fbbf24" stroke-width="1" />
        <text x="0" y="5" text-anchor="middle" fill="#fde68a" class="pill-text">📊 Observability</text>
      </g>
    </g>

    <!-- Subtle Bottom Version / Tagline -->
    <text x="0" y="375" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#64748b" letter-spacing="1.5">
      HIGH THROUGHPUT • MULTI-CLOUD • RESILIENT INFRASTRUCTURE
    </text>
  </g>
</svg>
